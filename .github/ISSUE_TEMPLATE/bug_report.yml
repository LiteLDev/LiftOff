name: Bug report
description: Something in LiftOff does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Where does it happen?
      options:
        - Dedicated server (BDS)
        - Single-player / local world (client mod)
        - Client mod joining a server
        - Vanilla client joining a server with LiftOff
    validations:
      required: true
  - type: input
    id: liftoff
    attributes:
      label: LiftOff version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: levilamina
    attributes:
      label: LeviLamina version
      placeholder: 26.51.7
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: 1.26.51.01
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Relevant lines from the server console or `logs/latest.log` (lines with `[LiftOff]`, errors, crash reports).
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
